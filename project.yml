# Pour 的 Xcode 工程（ADR A15：XcodeGen 生成，不提交 .xcodeproj，工程文件不再有合并冲突）
# 生成：scripts/bootstrap.sh 或 `xcodegen generate --spec project.yml`
name: Pour
options:
  bundleIdPrefix: com.lwopgkne
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  xcodeVersion: "27.1"

configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  PourKit:
    path: Packages/PourKit

targets:
  Pour:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
      # 小组件画的样子、勾待办、连服务器：App 也编译（开发版的「小组件样张」、Siri 的「记一句」用）
      - Extensions/WidgetViews
    entitlements:
      path: App/Pour.entitlements
      properties:
        # 和小组件、分享扩展共用：服务器地址放 App 组，设备钥匙放钥匙串共享组（docs/模块/产品优化.md R7）
        com.apple.security.application-groups: [group.$(POUR_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(POUR_BUNDLE_ID).shared]
    dependencies:
      - target: PourWidgets
      - target: PourShare
      - package: PourKit
        product: PourCore
      - package: PourKit
        product: PourData
      - package: PourKit
        product: PourAPI
      - package: PourKit
        product: PourPlatform
      - package: PourKit
        product: PourDesign
    info:
      path: App/Info.plist # 生成的文件，不提交
      properties:
        CFBundleDisplayName: Pour
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Canvas
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # 第一版 iPhone 只做竖屏（规范 11 第 3 节）
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64]
        # 只用系统的 HTTPS，不用自己的加密（出口合规，07 第 7 节）
        ITSAppUsesNonExemptEncryption: false
        # Pour 服务器的地址（Config/Base.xcconfig 的 POUR_SERVER_URL；产品主人 2026-10-19 选 B：业务规则和 AI 都在服务器上）。
        # 开发阶段服务器跑在这台 Mac 上、走局域网的 http；搬到阿里云、换成 https 以后这里换成那个地址
        PourServerURL: $(POUR_SERVER_URL)
        # 和扩展共用的两个组（PourPlatform 的 SharedStore 读）
        PourAppGroup: group.$(POUR_BUNDLE_ID)
        PourKeychainGroup: $(AppIdentifierPrefix)$(POUR_BUNDLE_ID).shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 真机连这台 Mac 上的网关要用局域网：系统第一次会问，这句话写清楚为什么
        NSLocalNetworkUsageDescription: 记录和整理都在电脑上的 Pour 里，要连上同一个 Wi-Fi 里的那台电脑。
        # 说话记录（生活画布2.0.md 第 6 节）：在手机上转成字，录音不存不传
        NSMicrophoneUsageDescription: 说话记录要用麦克风。说的话在这台手机上转成字，录音不存、不传。
        NSSpeechRecognitionUsageDescription: 把你说的话在这台手机上转成字。
        # pour:// 打开这个 App：服务器推到 Bark 的提醒，点一下回到 Pour；pour://open?path=/review/2026-10-18 打开那一页
        CFBundleURLTypes:
          - CFBundleURLName: $(POUR_BUNDLE_ID)
            CFBundleURLSchemes: [pour]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID)
        PRODUCT_NAME: Pour
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic

  # 桌面小组件、锁屏组件、控制中心按钮（docs/模块/产品优化.md R7）
  PourWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets/Sources
      - Extensions/WidgetViews
    dependencies:
      - package: PourKit
        product: PourAPI
      - package: PourKit
        product: PourDesign
      - package: PourKit
        product: PourPlatform
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.$(POUR_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(POUR_BUNDLE_ID).shared]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pour
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        PourAppGroup: group.$(POUR_BUNDLE_ID)
        PourKeychainGroup: $(AppIdentifierPrefix)$(POUR_BUNDLE_ID).shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID).widgets
        PRODUCT_NAME: PourWidgets
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # 从别的 App 分享文字、链接进来（docs/模块/产品优化.md R7）
  PourShare:
    type: app-extension
    platform: iOS
    sources:
      - Share/Sources
      - path: Extensions/WidgetViews/SharedClient.swift
    dependencies:
      - package: PourKit
        product: PourAPI
      - package: PourKit
        product: PourDesign
      - package: PourKit
        product: PourPlatform
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.$(POUR_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(POUR_BUNDLE_ID).shared]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Pour
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        PourAppGroup: group.$(POUR_BUNDLE_ID)
        PourKeychainGroup: $(AppIdentifierPrefix)$(POUR_BUNDLE_ID).shared
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID).share
        PRODUCT_NAME: PourShare
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  PourTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AppTests]
    dependencies:
      - target: Pour
      - package: PourKit
        product: PourDesign
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID).tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Pour.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Pour
        BUNDLE_LOADER: $(TEST_HOST)
        GENERATE_INFOPLIST_FILE: YES

  PourUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [AppUITests]
    dependencies:
      - target: Pour
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID).uitests
        TEST_TARGET_NAME: Pour
        GENERATE_INFOPLIST_FILE: YES

  PourGallery:
    type: application
    platform: iOS
    sources:
      - Gallery/Sources
      - Gallery/Resources
    dependencies:
      - package: PourKit
        product: PourDesign
    info:
      path: Gallery/Info.plist # 生成的文件，不提交
      properties:
        CFBundleDisplayName: Pour 画廊
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: Canvas
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        # 设计画廊不上架，只在开发时装（02 C4）
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID).gallery
        PRODUCT_NAME: PourGallery
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: IconPour IconLine
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        CODE_SIGN_STYLE: Automatic

  GalleryUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GalleryUITests]
    dependencies:
      - target: PourGallery
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(POUR_BUNDLE_ID).gallery.uitests
        TEST_TARGET_NAME: PourGallery
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Pour:
    build:
      targets:
        Pour: all
        PourTests: [test]
        PourUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PourTests
        - PourUITests
    archive:
      config: Release
  PourGallery:
    build:
      targets:
        PourGallery: all
        GalleryUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GalleryUITests
