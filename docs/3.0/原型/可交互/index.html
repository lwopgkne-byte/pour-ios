<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Pour 3.0 交互原型</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,0..1,0&icon_names=add,alarm,arrow_forward,auto_awesome,backspace,bedtime,bookmark,calendar_month,check,checklist,chevron_left,chevron_right,close,content_copy,currency_yuan,delete,description,directions_run,diversity_3,done_all,edit,emoji_objects,event,event_repeat,expand_more,favorite,feedback,flag,format_quote,forum,grid_view,group,history,home,info,insights,inventory_2,ios_share,keyboard_voice,lightbulb,local_cafe,local_fire_department,local_taxi,lunch_dining,menu_book,mic,monitor_heart,more_horiz,movie,notifications,person,pets,photo_library,pie_chart,psychology,push_pin,receipt_long,record_voice_over,redeem,refresh,repeat,restaurant,savings,schedule,school,search,sell,send,sentiment_dissatisfied,sentiment_neutral,sentiment_satisfied,sentiment_very_dissatisfied,sentiment_very_satisfied,settings,shopping_bag,shopping_cart,snooze,star,swap_horiz,thumb_up,timeline,today,trending_down,trending_up,tune,undo,visibility,visibility_off,wallet,warning,wb_sunny,work&display=block">
<style>
/* Pour 3.0 交互原型：一台 iPhone 15（390×844）里的 App。电脑上居中一台手机，手机上铺满屏幕。
   只有一种亮色（产品主人 2026-10-21 定的），颜色、字体都从下面这组令牌来，和 App 里生活画布 2.0 的 Theme 一致 */
:root{
  --bg:#F2F1EE; --card:#FFFFFF; --ink:#1C1B19; --ink2:#55524C; --ink3:#6B675F; --line:rgba(28,27,25,.10); --fill:rgba(28,27,25,.055); --fill2:rgba(28,27,25,.09);
  --accent:#1B5BC6; --accent-soft:rgba(27,91,198,.10);
  --good:#1E7A49; --good-soft:rgba(30,122,73,.11); --warn:#946000; --warn-soft:rgba(176,116,0,.12); --bad:#C0412F; --bad-soft:rgba(192,65,47,.10);
  --money:#B8740C; --money-soft:rgba(194,126,18,.12); --mood:#BC4A7E; --mood-soft:rgba(188,74,126,.11); --idea:#9E6E06; --idea-soft:rgba(168,117,8,.12);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;
  --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
  --ease:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:#D9D7D1;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:28px 0;box-sizing:border-box}
.device{position:relative;width:390px;height:844px;border-radius:56px;overflow:hidden;background:var(--bg);box-shadow:0 0 0 11px #1b1a18,0 0 0 12.5px #46433d,0 40px 90px rgba(0,0,0,.35);--top:54px;--bot:24px;isolation:isolate;transform:translateZ(0)}
@media (max-width:520px){.stage{display:block;padding:0;height:100%}.device{width:100%;height:100%;border-radius:0;box-shadow:none;--top:8px;--bot:6px}}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;direction:ltr;font-feature-settings:'liga';font-variation-settings:'FILL' 0,'wght' 500,'GRAD' 0,'opsz' 24;user-select:none;width:1em;overflow:hidden;flex:none}
.ms.f{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 24}
html:not(.icons-ready) .ms{visibility:hidden}
.num{font-family:var(--round);font-variant-numeric:tabular-nums}
.serif{font-family:var(--serif)}
.press{transition:transform .18s var(--ease),opacity .18s}
.press:active{transform:scale(.96)}

/* 页面、导航 */
.tabroot{position:absolute;inset:0}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:var(--bg);padding-bottom:190px;box-sizing:border-box;scrollbar-width:none;overscroll-behavior:contain}
.page::-webkit-scrollbar{display:none}
.pushed{animation:pushIn .46s var(--ease) both;box-shadow:-10px 0 40px rgba(0,0,0,.10)}
.pushed.leaving{animation:pushOut .32s cubic-bezier(.4,0,1,1) both}
@keyframes pushIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes pushOut{from{transform:none}to{transform:translateX(100%)}}
.zoomin{animation:zoomIn .42s var(--ease) both}
@keyframes zoomIn{from{transform:scale(.86);opacity:0;border-radius:40px}to{transform:none;opacity:1}}
.navbar{position:sticky;top:0;z-index:6;padding:calc(var(--top) + 2px) 12px 8px;display:flex;align-items:center;gap:8px;min-height:44px;transition:background .25s,box-shadow .25s}
.navbar.solid{background:rgba(242,241,238,.84);backdrop-filter:blur(20px) saturate(1.7);-webkit-backdrop-filter:blur(20px) saturate(1.7);box-shadow:0 .5px 0 var(--line)}
.navtitle{position:absolute;left:70px;right:70px;bottom:18px;text-align:center;font-size:17px;font-weight:600;opacity:0;transform:translateY(4px);transition:opacity .2s,transform .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navtitle.show{opacity:1;transform:none}
.navright{margin-left:auto;display:flex;gap:8px;align-items:center}
.lt{font-size:34px;font-weight:700;letter-spacing:.2px;margin:0 20px 6px;line-height:1.2}
.subtitle{margin:-2px 20px 10px;font-size:14px;color:var(--ink2)}
.glass{background:rgba(255,255,255,.80);backdrop-filter:blur(18px) saturate(1.8);-webkit-backdrop-filter:blur(18px) saturate(1.8);box-shadow:0 0 0 .5px rgba(0,0,0,.06),0 4px 18px rgba(0,0,0,.08)}
.iconbtn{width:40px;height:40px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;color:var(--ink);flex:none;padding:0}
.back{height:40px;border-radius:20px;padding:0 14px 0 4px;display:inline-flex;align-items:center;border:0;font-size:16px;cursor:pointer}
.card{background:var(--card);border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.035),0 3px 14px rgba(0,0,0,.035)}
.mx{margin-left:16px;margin-right:16px}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin:24px 20px 8px}
.sh h3{margin:0;font-size:18px;font-weight:700}
.sh .meta{font-size:13px;color:var(--ink3)}
.link{font-size:15px;color:var(--accent);border:0;background:none;padding:6px 0;cursor:pointer;display:inline-flex;align-items:center;gap:2px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;box-sizing:border-box;position:relative}
.sep{height:.5px;background:var(--line);margin-left:16px}
.chip{display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 13px;border-radius:16px;background:var(--fill);border:0;font-size:14px;cursor:pointer;white-space:nowrap;flex:none;transition:background .2s,color .2s}
.chip.on{background:var(--ink);color:#fff}
.chip.blue{background:var(--accent-soft);color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 8px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.primary{height:52px;border-radius:16px;border:0;background:var(--accent);color:#fff;font-size:17px;font-weight:600;width:100%;cursor:pointer}
.primary:disabled{opacity:.4}
.seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;margin:6px 16px 4px}
.seg button{flex:1;height:32px;border-radius:8px;border:0;background:none;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;transition:background .2s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.empty{padding:28px 20px;text-align:center;color:var(--ink3);font-size:15px;line-height:1.6}

/* 底部：说一句 + 标签栏 */
.dock{position:absolute;left:0;right:0;bottom:var(--bot);z-index:30;pointer-events:none}
.say{pointer-events:auto;margin:0 16px 10px;height:50px;border-radius:25px;display:flex;align-items:center;gap:8px;padding:0 5px 0 6px;transition:transform .4s var(--ease),opacity .3s;border:0;width:calc(100% - 32px);box-sizing:border-box;cursor:pointer;text-align:left}
.say.hide{transform:translateY(64px) scale(.9);opacity:0;pointer-events:none}
.say .ph{flex:1;font-size:15.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mic{width:40px;height:40px;border-radius:20px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;flex:none}
.tabbar{pointer-events:auto;display:flex;gap:10px;padding:0 16px}
.tabs{flex:1;height:62px;border-radius:31px;display:flex;align-items:center;padding:0 4px;box-sizing:border-box}
.tab{flex:1;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;border:0;background:none;cursor:pointer;transition:background .25s,color .25s}
.tab.on{color:var(--accent);background:rgba(27,91,198,.10)}
.searchbtn{width:62px;height:62px;border-radius:31px;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.searchbtn.on{color:var(--accent);background:rgba(220,230,248,.9)}

/* 弹层 */
.sheetwrap{position:absolute;inset:0;z-index:50}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.28);animation:fadeIn .3s ease both}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#F7F6F3;border-radius:30px 30px 0 0;box-shadow:0 -8px 40px rgba(0,0,0,.18);animation:sheetIn .5s var(--ease) both;display:flex;flex-direction:column;max-height:calc(100% - var(--top) - 10px);overflow:hidden}
.sheet.tall{height:calc(100% - var(--top) - 10px)}
.closing .backdrop{animation:fadeOut .28s ease both}
.closing .sheet{animation:sheetOut .3s cubic-bezier(.4,0,1,1) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{from{transform:none}to{transform:translateY(100%)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.grab{padding:8px 0 4px;cursor:grab;touch-action:none;flex:none}
.grab i{display:block;width:38px;height:5px;border-radius:3px;background:rgba(28,27,25,.2);margin:0 auto}
.shead{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px 20px;flex:none}
.shead h2{margin:0;font-size:18px;font-weight:700}
.sbody{overflow-y:auto;flex:1;padding-bottom:calc(24px + var(--bot));scrollbar-width:none}
.sbody::-webkit-scrollbar{display:none}
.closex{width:34px;height:34px;border-radius:17px;border:0;background:var(--fill2);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.grp{background:#fff;border-radius:16px;margin:0 16px;overflow:hidden}
.grp .row{min-height:50px}
.rl{width:62px;font-size:15px;color:var(--ink2);flex:none}

/* 轻提示、长按菜单 */
.toast{position:absolute;left:16px;right:16px;z-index:80;bottom:calc(var(--bot) + 140px);background:rgba(34,33,30,.94);color:#fff;border-radius:16px;padding:12px 10px 12px 16px;display:flex;align-items:center;gap:10px;font-size:15px;animation:toastIn .45s var(--ease) both;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast .tx{flex:1;line-height:1.4}
.toast button{border:0;background:rgba(255,255,255,.14);color:#fff;height:32px;padding:0 12px;border-radius:16px;font-size:14px;font-weight:600;cursor:pointer;flex:none}
@keyframes toastIn{from{transform:translateY(20px);opacity:0}to{transform:none;opacity:1}}
.menuwrap{position:absolute;inset:0;z-index:70;background:rgba(242,241,238,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);animation:fadeIn .2s ease both;display:flex;flex-direction:column;justify-content:center;padding:0 16px}
.menuprev{border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:lift .3s var(--ease) both}
@keyframes lift{from{transform:scale(.96)}to{transform:scale(1.02)}}
.menu{margin-top:12px;width:250px;background:rgba(250,249,247,.96);border-radius:14px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18);animation:menuIn .32s var(--ease) both;transform-origin:top left}
@keyframes menuIn{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.menu button{display:flex;align-items:center;justify-content:space-between;width:100%;height:46px;padding:0 16px;border:0;background:none;font-size:16px;cursor:pointer;border-bottom:.5px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button.red{color:var(--bad)}

/* 待办 */
.trow{display:flex;align-items:center;gap:10px;min-height:58px;padding:8px 14px 8px 8px;background:#fff;position:relative;box-sizing:border-box;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.ck{width:44px;height:44px;display:flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer;flex:none;padding:0}
.ck i{width:25px;height:25px;border-radius:13px;border:2px solid rgba(28,27,25,.28);box-sizing:border-box;display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s}
.ck.on i{background:var(--accent);border-color:var(--accent);animation:pop .4s var(--ease)}
@keyframes pop{0%{transform:scale(.55)}55%{transform:scale(1.18)}100%{transform:scale(1)}}
.tt{font-size:16.5px;line-height:1.35;transition:color .3s}
.trow.done .tt{color:var(--ink3);text-decoration:line-through;text-decoration-color:rgba(28,27,25,.4)}
.tsub{font-size:12.5px;color:var(--ink3);margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.calbar{width:4px;height:28px;border-radius:2px;margin:0 20px 0 18px;flex:none}
.swipe{position:relative;overflow:hidden;background:#fff}
.sw-right{position:absolute;top:0;bottom:0;right:0;display:flex}
.sw-left{position:absolute;inset:0;display:flex;align-items:center;padding-left:24px;gap:6px;background:var(--good);color:#fff;font-size:15px;font-weight:700}
.sa{width:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#fff;font-size:12.5px;font-weight:600;border:0;cursor:pointer}
.flash{animation:flash 1.4s ease both}
@keyframes flash{0%,30%{background:#E6EEFB}100%{background:#fff}}
.timeline{position:relative;margin:4px 16px 0;padding:6px 0 10px}
.hour{display:flex;align-items:flex-start;height:44px;font-size:11.5px;color:var(--ink3)}
.hour span{width:42px;transform:translateY(-6px)}
.hour i{flex:1;border-top:.5px solid var(--line)}
.blk{position:absolute;left:52px;right:6px;border-radius:10px;padding:6px 10px;font-size:13.5px;box-sizing:border-box;overflow:hidden}

/* 钱 */
.hero{padding:18px 18px 16px}
.big{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.05}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;padding:2px 10px 12px}
.wd{text-align:center;font-size:12px;color:var(--ink3);padding:2px 0 4px}
.day{height:52px;border-radius:12px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:7px;gap:3px;cursor:pointer;position:relative;box-sizing:border-box}
.day .d{font-size:11.5px;color:var(--ink3);font-family:var(--round);line-height:1}
.day .a{font-size:12.5px;font-weight:650;font-family:var(--round);font-variant-numeric:tabular-nums;letter-spacing:-.3px;line-height:1.1;color:var(--ink)}
.day.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.day.sel{background:var(--accent)!important;box-shadow:0 4px 12px rgba(27,91,198,.3)}
.day.sel .d,.day.sel .a{color:#fff}
.day.future{opacity:.32;cursor:default}
.bar{height:8px;border-radius:4px;background:var(--fill);position:relative;overflow:hidden;flex:1}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .6s var(--ease)}
.qa{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border:0;background:none;cursor:pointer;position:relative;padding:0;flex:1}
.qa .c{width:52px;height:52px;border-radius:26px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.05),0 3px 10px rgba(0,0,0,.05)}
.badge{position:absolute;top:-3px;left:calc(50% + 14px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#E7E4DE;color:#3A3833;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--round)}
.mrow{display:flex;align-items:center;gap:12px;min-height:58px;padding:8px 16px;background:#fff;position:relative;box-sizing:border-box;touch-action:pan-y;cursor:pointer}
.cico{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.amt{font-size:16.5px;font-weight:650;font-family:var(--round);font-variant-numeric:tabular-nums;white-space:nowrap}
.pad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 12px}
.key{height:54px;border-radius:14px;border:0;background:#fff;box-shadow:0 1px 0 rgba(0,0,0,.12);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:500;cursor:pointer;font-family:var(--round)}
.key:active{background:#E8E6E1}
.worth{width:236px;flex:none;padding:16px;box-sizing:border-box}

/* 我的 */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:18px;padding:16px 4px 18px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12.5px;border:0;background:none;cursor:pointer;position:relative;padding:0}
.sq{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 -1px 0 rgba(0,0,0,.08)}
.tile .bd{position:absolute;top:-5px;left:calc(50% + 15px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#E7E4DE;color:#3A3833;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.jig{animation:jig .32s ease-in-out infinite alternate}
.jig:nth-child(2n){animation-delay:-.16s}
@keyframes jig{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
.mk{position:absolute;top:-6px;left:calc(50% - 32px);width:22px;height:22px;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.gname{font-size:13px;font-weight:600;color:var(--ink2);margin:14px 0 0 18px}
.qbig{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;border:0;background:none;cursor:pointer;padding:0}
.qbig .c{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center}

/* 心情、感悟 */
.face{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--ink2);border:0;background:none;cursor:pointer;flex:1;padding:0;transition:transform .3s var(--ease)}
.face .c{width:50px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--ease),box-shadow .3s}
.face.sel .c{transform:scale(1.14);box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--mood)}
.face.sel{color:var(--ink);font-weight:700}
.mcal .day{height:48px;padding-top:6px}
.moment{border-left:2px solid rgba(28,27,25,.15);padding-left:10px;margin-top:6px;font-family:var(--serif);font-size:15.5px;line-height:1.55;color:#33312C}
.flip{perspective:1200px}
.flipin{position:relative;transition:transform .6s var(--ease);transform-style:preserve-3d}
.flipin.on{transform:rotateY(180deg)}
.flipface{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flipback{position:absolute;inset:0;transform:rotateY(180deg)}
.swapout{animation:swapOut .32s ease-in both}
.swapin{animation:swapIn .5s var(--ease) both}
@keyframes swapOut{to{transform:translateX(-40px);opacity:0}}
@keyframes swapIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}

function classify(t) {

  const m = t.match(/(\d+(?:\.\d+)?)\s*(块|元)?/);
  if (m) return { kind: 'money', title: `${t.replace(m[0], '').trim() || '一笔'} ¥${m[1]}`, sub: '日常 · 记在今天', amt: parseFloat(m[1]), name: t.replace(m[0], '').trim() || '一笔' };

  if (/悟|明白|原来|记一句|道理/.test(t)) return { kind: 'insight', title: '感悟', sub: t };
  return { kind: 'note', title: '记下了', sub: t };
}

function SheetBox({ s, close }) {
  const [Comp, size] = SHEETS[s.name]; const ref = useRef(null); const st = useRef(null);
  const down = (e) => { st.current = e.clientY; e.currentTarget.setPointerCapture(e.pointerId); if (ref.current) ref.current.style.transition = 'none'; };
  const move = (e) => { if (st.current === null || !ref.current) return; const d = Math.max(0, e.clientY - st.current); ref.current.style.transform = `translateY(${d}px)`; };
  const up = (e) => { if (st.current === null || !ref.current) return; const d = e.clientY - st.current; st.current = null; ref.current.style.transition = 'transform .35s cubic-bezier(.32,.72,0,1)'; if (d > 110) close(); else ref.current.style.transform = ''; };
  return html`<div class="sheetwrap ${s.closing ? 'closing' : ''}"><div class="backdrop" onClick=${close}/>
    <div class="sheet ${size}" ref=${ref} role="dialog" aria-modal="true"><div class="grab" onPointerDown=${down} onPointerMove=${move} onPointerUp=${up} onPointerCancel=${up}><i/></div><${Comp} ...${s.props} close=${close}/></div></div>`;
}

      <div class="menuprev" onClick=${(e) => e.stopPropagation()}><div class="trow" style=${{ borderRadius: '18px' }}><span class="ck"><i/></span><div style=${{ flex: 1 }}><div class="tt">${menuTodo.title}</div>${menuTodo.said && html`<div class="tsub">${menuTodo.said.split('：')[0]}</div>`}</div>${menuTodo.time && html`<span class="pill num" style=${{ background: 'var(--accent-soft)', color: 'var(--accent)' }}>${menuTodo.time}</span>`}</div></div>
      <div class="menu" onClick=${(e) => e.stopPropagation()}>${[['完成', 'check', () => toggleTodo(menuTodo.id)], ['推迟到…', 'snooze', () => openSheet('snooze', { id: menuTodo.id })], ['改时间', 'schedule', () => openSheet('todo', { id: menuTodo.id })], ['复制', 'content_copy', () => toast('拷贝好了')], ['看原话', 'format_quote', () => openSheet('todo', { id: menuTodo.id })], ['删除', 'delete', () => deleteTodo(menuTodo.id), true]].map(([n, ic, fn, red]) => html`<button class=${red ? 'red' : ''} onClick=${() => { setMenu(null); fn(); }}>${n}<${I} n=${ic} s=${20}/></button>`)}</div>
    </div>`}
    ${toastS && html`<div class="toast" key=${toastS.id} role="status"><span class="tx">${toastS.text}</span>${toastS.undo && html`<button onClick=${() => { toastS.undo(); setToastS(null); }}>撤销</button>`}</div>`}
  <//>`;
}
(function waitIcons() {
  const ready = () => document.documentElement.classList.add('icons-ready');
  const link = document.querySelector('link[href*="Material+Symbols"]');
  const go = () => { if (!document.fonts || !document.fonts.load) return ready(); document.fonts.load('24px "Material Symbols Rounded"', 'check').then((f) => (f && f.length ? ready() : setTimeout(go, 150)), ready); };
  if (!link || link.sheet) go(); else { link.addEventListener('load', go); link.addEventListener('error', ready); }
  setTimeout(ready, 6000);
})();
window.addEventListener('error', (e) => { const d = document.createElement('div'); d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:9999;background:#C0412F;color:#fff;font:12px/1.4 monospace;padding:8px;border-radius:8px;white-space:pre-wrap'; d.textContent = '出错了：' + (e.message || e.error); document.body.appendChild(d); });
render(html`<${App}/>`, document.getElementById('app'));
</script>
</body></html>
