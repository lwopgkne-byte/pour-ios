<helmet>
<style>
body{margin:0}
.scr{width:390px;height:1250px;position:relative;overflow:hidden;background:#F3F2EF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:#1D1C1A}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif}
.q{font-family:"Songti SC","STSong","Noto Serif SC",serif}
.card{background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.glass{background:rgba(255,255,255,.86);box-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.07);backdrop-filter:blur(20px)}
.chip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:16px;font-size:14px;background:#FFFFFF;box-shadow:0 0 0 1px rgba(29,28,26,.10) inset;flex:none}

.ins{padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
.meta{font-size:12px;color:#6B6760;display:flex;align-items:center;gap:6px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;background:rgba(170,120,10,.10);color:#7A5300}
.star{position:absolute;right:14px;top:14px;color:#C98315}
.act{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:rgba(29,28,26,.06);font-size:14px;font-weight:600}
</style>

<div class="scr">

    <div style="display:flex;gap:8px;margin-top:16px">

      <span class="act"><svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 7l4-4 4 4"></path><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"></path></svg>分享</span>
      <span class="act">换一句</span>
    </div>
  </div>

  <div style="display:flex;gap:8px;padding:16px 16px 0 16px;overflow:hidden">
    <span class="chip on">全部 <span class="num">22</span></span><span class="chip">语录 <span class="num">5</span></span><span class="chip">工作 <span class="num">6</span></span><span class="chip">专注 <span class="num">3</span></span><span class="chip">家人 <span class="num">2</span></span>
  </div>

    <div class="card ins"><svg class="ico star" style="width:18px;height:18px;fill:#C98315" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z"></path></svg><div class="q" style="font-size:19px;line-height:1.5;padding-right:24px">陪儿子的时候，就只陪儿子。</div><div class="meta num">10月24日<span class="tag">家人</span><span class="tag">专注</span></div></div>
    <div class="card ins"><div class="q" style="font-size:19px;line-height:1.5">关掉消息专心做一件事，两个小时顶一天。</div><div class="meta num">10月23日<span class="tag">专注</span><span class="tag">效率</span><span style="margin-left:auto;color:#58554F">以前也说过类似的 2 条</span></div></div>
    <div class="card ins"><svg class="ico star" style="width:18px;height:18px;fill:#C98315" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.8z"></path></svg><div class="q" style="font-size:19px;line-height:1.5;padding-right:24px">少做一个功能，往往比多做一个更难。</div><div class="meta num">10月18日<span class="tag">工作</span><span class="tag">取舍</span></div></div>
    <div class="card ins"><div class="q" style="font-size:19px;line-height:1.5">睡前读半小时书，比刷手机睡得踏实。</div><div class="meta num">10月15日<span class="tag">阅读</span><span class="tag">睡眠</span></div></div>
  </div>
</div>
