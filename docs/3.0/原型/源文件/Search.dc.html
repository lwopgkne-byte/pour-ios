<style>
body{margin:0}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background:#F3F2EF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:#1D1C1A}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif}
.q{font-family:"Songti SC","STSong","Noto Serif SC",serif}
.card{background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.glass{background:rgba(255,255,255,.86);box-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.07);backdrop-filter:blur(20px)}
.sec{font-size:13px;font-weight:600;color:#58554F;margin:18px 20px 8px 20px}
.row{display:flex;align-items:center;gap:12px;min-height:52px;padding:8px 16px;box-sizing:border-box}
.sep{height:1px;background:rgba(29,28,26,.08);margin-left:16px}
.src{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:rgba(27,86,179,.12);color:#1B56B3;font-size:11px;font-weight:700;vertical-align:2px;margin-left:2px}
.tabs{position:absolute;left:16px;bottom:30px;height:62px;width:282px;border-radius:31px;display:flex;justify-content:space-around;align-items:center;padding:0 4px;box-sizing:border-box}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;width:66px;height:54px;border-radius:27px;color:#1D1C1A}
</style>

      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:20px;border-radius:6px;background:rgba(201,131,21,.35)"></div><span class="num" style="font-size:11px;color:#6B6760">第 3 周</span></div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px"><div style="width:100%;height:52px;border-radius:6px;background:#C98315"></div><span class="num" style="font-size:11px;color:#6B6760">这周</span></div>
    </div>

    <div class="sep"></div>
    <div class="row"><div style="flex:1;min-width:0"><div class="q" style="font-size:16px">外卖点了沙拉 38 减肥</div><div class="num" style="font-size:12px;color:#6B6760;margin-top:2px">10月26日 周一 10:10</div></div></div>
    <div class="sep"></div>
    <div class="row"><div style="flex:1;min-width:0"><div class="q" style="font-size:16px">加班饿了 点了份烧烤当夜宵 68</div><div class="num" style="font-size:12px;color:#6B6760;margin-top:2px">10月19日 周一 22:20 · 意思相近</div></div></div>
  </div>

  <div class="sec">目标</div>

    <div class="row"><svg width="30" height="30" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(29,28,26,.08)" stroke-width="7"></circle><circle cx="20" cy="20" r="15" fill="none" stroke="#1A683D" stroke-width="7" stroke-linecap="round" stroke-dasharray="66 95" transform="rotate(-90 20 20)"></circle></svg><div style="flex:1;font-size:16px">每月外卖不超过 300 元</div><span class="num" style="font-size:14px;color:#58554F">¥210 / 300</span></div>
