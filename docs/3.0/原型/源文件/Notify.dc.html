  </div>

      </div>
    </div>

      <div class="act"><span style="font-weight:600;color:#1B56B3">完成</span><svg class="ico" style="width:18px;height:18px;color:#1B56B3;stroke-width:2.3" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></div>

      <div class="act"><span>10 分钟后再提醒</span><svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></div>
      <div class="asep"></div>
      <div class="act"><span>1 小时后再提醒</span><svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></div>
      <div class="asep"></div>
      <div class="act"><span>明天早上再提醒</span><svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M4.6 4.6L6 6M2.5 12h2M19.5 12h2M18 6l1.4-1.4"></path></svg></div>
    </div>
  </div>

  <div style="position:relative;margin:18px 14px 0 14px">
    <div class="noti" style="display:flex;gap:12px;align-items:flex-start;opacity:.96">
      <div class="appicon"><svg class="ico" style="color:#FFFFFF;width:22px;height:22px" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5h14v9a5 5 0 0 1-5 5h-4a5 5 0 0 1-5-5z"></path><path d="M19 8h1.5a2 2 0 0 1 0 4H19"></path></svg></div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;justify-content:space-between;font-size:13px;color:#58554F"><span style="font-weight:600">Pour</span><span>21:30</span></div>
        <div style="font-size:16px;font-weight:600;margin-top:2px">今天心情怎么样？</div>
        <div style="font-size:14px;color:#3A3833;margin-top:2px">按住选一个就记下，不用打开 Pour（晚上问问心情：选开）</div>
