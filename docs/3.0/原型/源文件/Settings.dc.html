<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.scr{width:390px;height:1300px;position:relative;overflow:hidden;background:#F3F2EF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:#1D1C1A}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.glass{background:rgba(255,255,255,.86);box-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.07);backdrop-filter:blur(20px)}
.gh{font-size:13px;color:#58554F;margin:20px 32px 6px 32px}
.grp{background:#FFFFFF;border-radius:16px;margin:0 16px}
.row{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;box-sizing:border-box}
.ic{width:29px;height:29px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;flex:none}
.ic .ico{width:17px;height:17px}
.lab{flex:1;font-size:16px}
.val{font-size:15px;color:#58554F}
.chev{width:14px;height:14px;color:#A39E95}
.sep{height:1px;background:rgba(29,28,26,.08);margin-left:55px}
.tg{width:51px;height:31px;border-radius:16px;position:relative;flex:none}
.tg.on{background:#34A853}
.tg.off{background:rgba(29,28,26,.14)}
.tg:after{content:"";position:absolute;top:2px;width:27px;height:27px;border-radius:14px;background:#FFFFFF;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.tg.on:after{right:2px}
.tg.off:after{left:2px}
</style>
</helmet>
<div class="scr">
  <div style="padding:52px 16px 0 12px"><button class="btn glass" aria-label="返回" style="height:40px;border-radius:20px;padding:0 12px 0 8px;display:flex;align-items:center;gap:2px;font-size:16px"><svg class="ico" style="width:20px;height:20px" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>我的</button></div>
  <h1 style="margin:10px 20px 0 20px;font-size:34px;font-weight:700">设置</h1>

  <div class="gh">提醒和通知</div>
  <div class="grp">
    <div class="row"><div class="ic" style="background:#4F5FD0"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v16H6a2 2 0 0 0-2 2zM20 5.5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z"></path></svg></div><div class="lab">每日回顾</div><span class="val num">07:30</span><div class="tg on"></div></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#C9487F"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 14s1.3 2 3.5 2 3.5-2 3.5-2M9 9.8h.01M15 9.8h.01"></path></svg></div><div class="lab">晚上问一句</div><span class="val num">21:30</span><div class="tg on"></div></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#D4682A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17h.01"></path></svg></div><div class="lab">预警</div><div class="tg on"></div></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#6B5BC7"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></div><div class="lab">周报和月报</div><div class="tg on"></div></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#5B5750"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"></path></svg></div><div class="lab">免打扰</div><span class="val num">23:00–07:00</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>

  <div class="gh">记录</div>
  <div class="grp">
    <div class="row"><div class="ic" style="background:#22895A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg></div><div class="lab">类别</div><span class="val num">18 个</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#B07A0E"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 20 17h-9l-5 4v-4H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 5z"></path></svg></div><div class="lab">你的说法</div><span class="val num">3 个</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#3E7FCC"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></div><div class="lab">几点以前算前一天</div><span class="val num">凌晨 4:00</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>

  <div class="gh">隐私和数据</div>
  <div class="grp">
    <div class="row"><div class="ic" style="background:#C98315"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></div><div class="lab">打开钱要面容 ID</div><div class="tg off"></div></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#D2453B"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-4.5 3.5 9 2-4.5H21"></path></svg></div><div class="lab">健康</div><span class="val">已接上</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#E5534B"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></div><div class="lab">日历</div><span class="val">已接上</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#5B5750"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M8 11l4 4 4-4"></path><path d="M5 17v2.5h14V17"></path></svg></div><div class="lab">导出和备份</div><span class="val num">今天 00:35</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#8253C9"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></div><div class="lab">演示数据</div><span class="val">正在用</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>

  <div class="gh">AI 和用量</div>
  <div class="grp">
    <div class="row"><div class="ic" style="background:#1B56B3"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></div><div class="lab">用哪个</div><div style="display:flex;background:rgba(29,28,26,.07);border-radius:8px;padding:2px"><span style="padding:5px 10px;border-radius:6px;background:#FFFFFF;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)">便宜</span><span style="padding:5px 10px;font-size:13px;color:#58554F">最强</span></div></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#22895A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 7.5L12 12l3.5-4.5M12 12v5M9 12.5h6M9 15h6"></path></svg></div><div class="lab">这个月花了</div><span class="val num">¥3.2 · 不设上限</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>

  <div class="gh">关于</div>
  <div class="grp">
    <div class="row"><div class="ic" style="background:#5B5750"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect><path d="M11 18.5h2"></path></svg></div><div class="lab">这台手机和设备</div><span class="val num">4 台</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
    <div class="sep"></div>
    <div class="row"><div class="ic" style="background:#1B56B3"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8h.01"></path></svg></div><div class="lab">关于 Pour</div><span class="val num">3.0 · 服务器 2.8.2</span><svg class="ico chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></div>
  </div>
  <div style="margin:10px 32px 0 32px;font-size:13px;color:#58554F;line-height:1.5">AI 准不准的数字在「关于 Pour → AI 表现」里。密钥、PIN、导入在电脑上的「Pour 设置」里改。</div>
</div>
</x-dc>
