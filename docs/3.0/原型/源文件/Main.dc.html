<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>今天</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background:#F3F2EF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:#1D1C1A}
.num{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"PingFang SC",sans-serif}
.card{background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.glass{background:rgba(255,255,255,.86);box-shadow:0 6px 24px rgba(0,0,0,.10),0 0 0 .5px rgba(0,0,0,.07);backdrop-filter:blur(20px)}
.say{position:absolute;left:16px;right:16px;bottom:100px;height:50px;border-radius:25px;display:flex;align-items:center;gap:10px;padding:0 5px 0 14px;box-sizing:border-box}
.tabs{position:absolute;left:16px;bottom:30px;height:62px;width:282px;border-radius:31px;display:flex;justify-content:space-around;align-items:center;padding:0 4px;box-sizing:border-box}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:600;width:66px;height:54px;border-radius:27px;color:#1D1C1A}
.tab.on{color:#1B56B3;background:rgba(27,86,179,.10)}
.srch{position:absolute;right:16px;bottom:30px;width:62px;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center}
.row{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 16px;box-sizing:border-box}
.sep{height:1px;background:rgba(29,28,26,.08);margin-left:52px}
.circle{width:24px;height:24px;border-radius:12px;border:2px solid rgba(29,28,26,.28);box-sizing:border-box;flex:none}
.cal{width:4px;height:24px;border-radius:2px;flex:none;margin:0 10px 0 10px}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:11px;font-size:12px;font-weight:600}
</style>
</helmet>
<div class="scr">
  <div style="padding:58px 16px 0 16px;display:flex;align-items:center;justify-content:space-between">
    <button class="btn glass" style="height:44px;border-radius:22px;padding:0 16px;display:flex;align-items:center;gap:6px;font-size:16px;font-weight:600">今天 · 10月27日
      <svg class="ico" style="width:16px;height:16px" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button class="btn glass" aria-label="跳到某一天" style="width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
    </button>
  </div>

  <div class="card" style="margin:16px 16px 0 16px;padding:6px 0 6px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 16px 6px 16px">
      <div style="display:flex;align-items:center;gap:8px;font-size:17px;font-weight:700">待办
        <svg class="ico" style="width:16px;height:16px;color:#6B6760" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
      </div>
      <div style="font-size:13px;color:#58554F">还有 2 件</div>
    </div>
    <div class="row"><div class="cal" style="background:#D6609A;margin:0 10px 0 10px"></div><div style="flex:1;font-size:16px">结婚纪念日</div><span class="pill" style="background:rgba(29,28,26,.06);color:#58554F">全天 · 日历</span></div>
    <div class="sep"></div>
    <div class="row"><div class="circle" style="margin:0 0 0 0"></div><div style="flex:1;font-size:16px">给客户回电话</div><span class="pill num" style="background:rgba(27,86,179,.10);color:#1B56B3">10:00</span></div>
    <div class="sep"></div>
    <div class="row"><div class="cal" style="background:#2F7DE1"></div><div style="flex:1;font-size:16px">需求评审</div><span class="num" style="font-size:13px;color:#58554F">14:00–15:30</span></div>
    <div class="sep"></div>
    <div class="row"><div class="circle"></div><div style="flex:1;font-size:16px">把会员改版的 PRD 发给研发</div><span class="pill num" style="background:rgba(27,86,179,.10);color:#1B56B3">17:30</span></div>
  </div>

  <div style="display:flex;gap:12px;margin:12px 16px 0 16px">
    <div class="card" style="flex:1;padding:14px;display:flex;align-items:center;gap:12px">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(29,28,26,.08)" stroke-width="6"></circle><circle cx="20" cy="20" r="16" fill="none" stroke="#1A683D" stroke-width="6" stroke-linecap="round" stroke-dasharray="27 101" transform="rotate(-90 20 20)"></circle></svg>
      <div><div class="num" style="font-size:17px;font-weight:700">第 8 天</div><div style="font-size:12px;color:#58554F">连续 30 天 16:8</div></div>
    </div>
    <div class="card" style="flex:1;padding:14px;display:flex;align-items:center;gap:12px">
      <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16" fill="none" stroke="rgba(29,28,26,.08)" stroke-width="6"></circle><circle cx="20" cy="20" r="16" fill="none" stroke="#AA3831" stroke-width="6" stroke-linecap="round" stroke-dasharray="56 101" transform="rotate(-90 20 20)"></circle></svg>
      <div><div class="num" style="font-size:17px;font-weight:700">4,493 步</div><div style="font-size:12px;color:#58554F">每天走 8000 步</div></div>
    </div>
  </div>

  <div class="card" style="margin:12px 16px 0 16px;padding:16px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:15px;font-weight:700">饮食</div>
      <div class="num" style="font-size:13px;color:#58554F">花了 ¥15</div>
    </div>
    <div style="margin-top:10px;height:8px;border-radius:4px;background:rgba(29,28,26,.06);position:relative">
      <div style="position:absolute;left:50%;width:33%;top:0;bottom:0;border-radius:4px;background:#E0A23B"></div>
    </div>
    <div style="display:flex;justify-content:space-between;font-size:11px;color:#6B6760;margin-top:4px" class="num"><span>0:00</span><span>12:00 进食 8 小时</span><span>24:00</span></div>
    <div style="font-size:15px;margin-top:10px">食堂午饭 · 公司食堂</div>
  </div>

  <div class="say glass">
    <svg class="ico" style="color:#58554F" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5h11a2 2 0 0 1 2 2V13a2 2 0 0 1-2 2H9l-3.5 3v-3H4a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2z"></path><path d="M19 9h1a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-1v2.5L16 18h-3"></path></svg>
    <div style="flex:1;font-size:16px;color:#6B6760">说一句……</div>
    <button class="btn" aria-label="按住说话" style="width:40px;height:40px;border-radius:20px;background:#1B56B3;color:#FFFFFF;display:flex;align-items:center;justify-content:center">
      <svg class="ico" style="width:20px;height:20px" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3.5" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"></path></svg>
    </button>
  </div>

  <div class="tabs glass">
    <div class="tab on"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M4.6 4.6L6 6M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4L6 18M18 6l1.4-1.4"></path></svg>今天</div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 6h10M10 12h10M10 18h10"></path><path d="M3.5 6l1.4 1.4L7.5 5M3.5 12l1.4 1.4L7.5 11M3.5 18l1.4 1.4L7.5 17"></path></svg>待办</div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 7.5L12 12l3.5-4.5M12 12v5M9 12.5h6M9 15h6"></path></svg>钱</div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"></rect><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"></rect><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"></rect></svg>我的</div>
  </div>
  <button class="btn srch glass" aria-label="搜索"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
</div>
</x-dc>
