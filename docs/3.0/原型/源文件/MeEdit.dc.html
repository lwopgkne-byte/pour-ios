<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>管理常用</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.scr{width:390px;height:844px;position:relative;overflow:hidden;background:#F3F2EF;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif;color:#1D1C1A}
.card{background:#FFFFFF;border-radius:20px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 2px 10px rgba(0,0,0,.035)}
.ico{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{border:0;background:none;font:inherit;color:inherit;padding:0;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));row-gap:16px}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;position:relative}
.sq{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#FFFFFF}
.sq .ico{width:24px;height:24px}
.minus{position:absolute;top:-6px;left:50px;width:20px;height:20px;border-radius:10px;background:#8E8A83;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1}
.plus{position:absolute;top:-6px;left:50px;width:20px;height:20px;border-radius:10px;background:#1B56B3;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:1}
.tilt1{transform:rotate(-2deg)}.tilt2{transform:rotate(2deg)}
.grp{font-size:13px;color:#58554F;font-weight:600;margin:0 0 14px 14px}
.dim{opacity:.38}
</style>
</helmet>
<div class="scr">
  <div style="padding:58px 16px 0 16px;display:flex;align-items:center;justify-content:space-between">
    <div style="width:60px"></div>
    <div style="font-size:17px;font-weight:600">管理常用</div>
    <button class="btn" style="width:60px;height:44px;font-size:17px;font-weight:600;color:#1B56B3;text-align:right">完成</button>
  </div>
  <div style="margin:12px 16px 0 16px;height:40px;border-radius:12px;background:rgba(29,28,26,.06);display:flex;align-items:center;gap:8px;padding:0 12px;color:#6B6760;font-size:15px">
    <svg class="ico" style="width:18px;height:18px" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg>搜功能，比如「报销」
  </div>

  <div style="margin:20px 20px 10px 20px;display:flex;justify-content:space-between;align-items:baseline">
    <div style="font-size:17px;font-weight:700">常用</div><div style="font-size:13px;color:#58554F">按住拖动换位置 · 最多 8 个</div>
  </div>
  <div class="card" style="margin:0 16px;padding:18px 4px">
    <div class="grid">
      <div class="tile tilt1"><div class="sq" style="background:#C9487F"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 14s1.3 2 3.5 2 3.5-2 3.5-2M9 9.8h.01M15 9.8h.01"></path></svg></div>心情<span class="minus">−</span></div>
      <div class="tile tilt2"><div class="sq" style="background:#B07A0E"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4"></path><path d="M12 3a6 6 0 0 0-3.6 10.8c.8.6 1.1 1.4 1.1 2.2h5c0-.8.3-1.6 1.1-2.2A6 6 0 0 0 12 3z"></path></svg></div>感悟<span class="minus">−</span></div>
      <div class="tile tilt1"><div class="sq" style="background:#4F5FD0"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v16H6a2 2 0 0 0-2 2zM20 5.5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z"></path></svg></div>回顾<span class="minus">−</span></div>
      <div class="tile tilt2"><div class="sq" style="background:#22895A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><circle cx="12" cy="12" r="4.8"></circle><circle cx="12" cy="12" r="1.2"></circle></svg></div>目标<span class="minus">−</span></div>
      <div class="tile tilt2"><div class="sq" style="background:#8253C9"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"></path></svg></div>关于我<span class="minus">−</span></div>
      <div class="tile tilt1"><div class="sq" style="background:#6B5BC7"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5-.8 2.6 15.6-3.5.8z"></path></svg></div>笔记库<span class="minus">−</span></div>
      <div class="tile tilt2"><div class="sq" style="background:#D4682A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13l2.5-7.5h13L21 13v5.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"></path><path d="M3 13h5l1.5 2.5h5L16 13h5"></path></svg></div>留意的<span class="minus">−</span></div>
      <div class="tile" style="color:#6B6760"><div class="sq" style="background:transparent;border:1.5px dashed rgba(29,28,26,.25);box-sizing:border-box;color:#6B6760"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"></path></svg></div>空位</div>
    </div>
  </div>

  <div style="margin:22px 20px 10px 20px;font-size:17px;font-weight:700">全部功能</div>
  <div class="card" style="margin:0 16px;padding:16px 4px 18px 4px">
    <div class="grp">回看</div>
    <div class="grid">
      <div class="tile dim"><div class="sq" style="background:#4F5FD0"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 3.5h5v16H6a2 2 0 0 0-2 2zM20 5.5a2 2 0 0 0-2-2h-5v16h5a2 2 0 0 1 2 2z"></path></svg></div>回顾</div>
      <div class="tile"><div class="sq" style="background:#3E7FCC"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg></div>日历<span class="plus">+</span></div>
      <div class="tile dim"><div class="sq" style="background:#6B5BC7"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h4v16H5zM10 4h4v16h-4zM15.5 5l3.5-.8 2.6 15.6-3.5.8z"></path></svg></div>笔记库</div>
      <div class="tile"><div class="sq" style="background:#C9487F"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></div>好时刻<span class="plus">+</span></div>
      <div class="tile"><div class="sq" style="background:#22895A"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V4M5 4h11l-2 4 2 4H5"></path></svg></div>你的一年<span class="plus">+</span></div>
    </div>
  </div>
  <div style="margin:14px 24px 0 24px;font-size:13px;color:#58554F;line-height:1.5">已经在常用里的变淡；点 + 加进去，点 − 拿出来。换手机也一样（存在服务器上）。</div>
</div>
</x-dc>

  }

</body>
</html>
