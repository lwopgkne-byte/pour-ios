# SwiftLint（ADR A16）：自动守住设计规范——功能代码里不许出现硬编码的颜色和字号，只能用 PourDesign 的令牌。
# 色值和字号只允许出现在 PourDesign 里（令牌定义的地方）。
included:
  - App
  - Widgets
  - Share
  - Extensions
  - AppTests
  - AppUITests
  - Gallery/Sources
  - GalleryUITests
  - Packages/PourKit/Sources
  - Packages/PourKit/Tests
excluded:
  - build
  - Packages/PourKit/.build

disabled_rules:
  - todo # 「以后」写在方案里，不写 TODO
  - trailing_comma # 交给 swift-format
  - opening_brace # 交给 swift-format：多行条件后的 { 按 swift-format 的风格换行

opt_in_rules:
  - empty_count
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - sorted_imports

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

identifier_name:
  # xs / sm / md / lg 是设计规范 06 的圆角令牌名；db 是 GRDB 惯用的数据库参数名（ADR A05）
  # bg / fg 是 Web 令牌的名字（底色、字色）
  # at / ok / to 是服务器接口里的字段名（什么时候、成没成、到哪天）：PourAPI 照原样解码，字段名一字不差
  excluded: [id, x, y, r, g, b, xs, sm, md, lg, db, bg, fg, at, ok, to]

nesting:
  type_level: 2

custom_rules:
  no_hardcoded_color:
    name: 不许硬编码颜色
    regex: '(Color|UIColor|NSColor)\(\s*(red|white|hue|srgbRed|#)|#colorLiteral|Color\.(red|blue|green|yellow|orange|purple|pink|gray|black|white)\b'
    excluded: 'Packages/PourKit/Sources/PourDesign/'
    message: '颜色只能用 PourDesign 的令牌：改过的页面用 Theme.Palette.xxx（docs/模块/生活画布2.0.md 8.3），没改的页面暂时用 Web.xxx'
    severity: error
  no_hardcoded_font:
    name: 不许硬编码字号
    regex: '\.system\(\s*size:|Font\.custom\(|UIFont\.(systemFont|boldSystemFont)\(ofSize:'
    excluded: 'Packages/PourKit/Sources/PourDesign/'
    message: '字只能用 PourDesign 的令牌：Theme.Typeface.xxx（生活画布2.0.md 8.1），没改的页面暂时用 Web.xxx'
    severity: error
  no_hardcoded_spacing:
    name: 不许硬编码间距
    regex: '\.padding\(\s*(\.[a-z]+\s*,\s*)?[1-9][0-9]*\s*\)|spacing:\s*[1-9][0-9]*[,)]'
    excluded: 'Packages/PourKit/Sources/PourDesign/'
    message: '间距只能用令牌：Theme.Space.xxx / Theme.Size.xxx（生活画布2.0.md 8.2），没改的页面暂时用 Web.spaceN'
    severity: error
  no_hardcoded_radius:
    name: 不许硬编码圆角
    regex: 'cornerRadius:\s*[0-9]+|\.pour\(\s*[0-9]+'
    excluded: 'Packages/PourKit/Sources/PourDesign/'
    message: '圆角只能用令牌：Theme.Corner.xxx 配 Theme.rounded(_:)（生活画布2.0.md 8.4），没改的页面暂时用 Web.radiusXxx'
    severity: error
  no_hardcoded_duration:
    name: 不许硬编码动画时长
    regex: '(duration|delay):\s*[0-9.]+'
    excluded: 'Packages/PourKit/Sources/PourDesign/'
    message: '动画只能用令牌：Theme.Motion.xxx（生活画布2.0.md 8.5），没改的页面暂时用 Web.panel / Web.fast'
    severity: error
  no_print:
    name: 不许用 print
    regex: '^\s*print\('
    # 界面测试把审计问题写进测试日志，那里没有原话
    excluded: 'UITests/'
    message: '日志用系统日志（Logger），原话标为私密（03 第 6.2 节）'
    severity: error
